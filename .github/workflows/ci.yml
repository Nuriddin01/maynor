name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall apps packages tests main.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy packages apps main.py
      - run: pytest -q
      - run: LOCAL_DB_PATH=/tmp/sleep_support_ci.sqlite3 python scripts/seed.py
