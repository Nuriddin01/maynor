[project]
name = "sleep-support-platform"
version = "1.1.0"
description = "Local-first Telegram sleep support platform"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.4,<4.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "pre-commit>=3.7,<4.0"
]
prod-db = [
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "redis>=5.0,<6.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["packages", "apps"]
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_redundant_casts = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
